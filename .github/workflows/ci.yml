name: Build and regression checks

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'bugfix/**', 'feature/**', 'release/**', 'hotfix/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CreaTShop-Client/package-lock.json
      - name: Backend regression checks
        shell: pwsh
        run: ./scripts/test-backend.ps1
      - name: Frontend build
        working-directory: CreaTShop-Client
        run: |
          npm ci
          npm run build
      - name: Frontend utility regression checks
        working-directory: CreaTShop-Client
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter '*.test.mjs' | ForEach-Object {
            node $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Frontend check failed: $($_.Name)" }
          }

  mysql-regression:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          TZ: Asia/Ho_Chi_Minh
          MYSQL_DATABASE: creatshop_regression_00000000000000000000000000000000
          MYSQL_USER: creatshop_checks
          MYSQL_PASSWORD: ci-only-checks
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TZ: Asia/Ho_Chi_Minh
      CREATSHOP_TEST_DB_NAME: creatshop_regression_00000000000000000000000000000000
      CREATSHOP_TEST_DB_PORT: '3308'
      CREATSHOP_TEST_DB_PASSWORD: ci-only-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Enable Maven wrapper
        run: chmod +x CreaTShop-server/creatshop/mvnw
      - name: MySQL regression checks
        shell: pwsh
        run: ./scripts/test-backend.ps1 -MySql
