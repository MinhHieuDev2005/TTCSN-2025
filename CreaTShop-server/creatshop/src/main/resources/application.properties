spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/creatshopdb3?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

auth.token.jwtSecret=${JWT_SECRET}
auth.token.expirationInMils=${JWT_EXPIRATION_MS:3600000}
auth.token.refreshInMils=${JWT_REFRESH_MS:7200000}

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

vnp.tmn-code=${VNP_TMN_CODE:}
vnp.hash-secret=${VNP_HASH_SECRET:}
vnp.url=${VNP_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnp.return-url=${VNP_RETURN_URL:http://localhost:5173/payment/vnpay-return}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.oauth2.base-url=${OAUTH2_BASE_URL:http://localhost:8080}
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth2.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth2.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v23.0}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
ai.enabled=${AI_ENABLED:false}
ai.url=${AI_URL:http://127.0.0.1:8001}
ai.model-version=${AI_MODEL_VERSION:multilingual-e5-small-v1}
ai.dimensions=${AI_DIMENSIONS:384}
ai.timeout-ms=${AI_TIMEOUT_MS:5000}
ai.index-timeout-ms=${AI_INDEX_TIMEOUT_MS:60000}
